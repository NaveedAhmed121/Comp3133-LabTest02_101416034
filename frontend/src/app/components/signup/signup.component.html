<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="card shadow" style="min-width: 380px; max-width: 440px; width: 100%;">
    <div class="card-header bg-dark text-white text-center py-3">
      <h4 class="mb-0 fw-bold">Employee Management App</h4>
      <small class="text-secondary">Create a new account</small>
    </div>
    <div class="card-body p-4">
      @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
      }

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="username">Username</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            placeholder="Enter username"
            [class.is-invalid]="signupForm.get('username')?.invalid && signupForm.get('username')?.touched"
          />
          <div class="invalid-feedback">Username must be at least 3 characters.</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="Enter email address"
            [class.is-invalid]="signupForm.get('email')?.invalid && signupForm.get('email')?.touched"
          />
          <div class="invalid-feedback">A valid email address is required.</div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold" for="password">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="Enter password (min 6 chars)"
            [class.is-invalid]="signupForm.get('password')?.invalid && signupForm.get('password')?.touched"
          />
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>

        <button type="submit" class="btn btn-dark w-100" [disabled]="signupForm.invalid || loading">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          {{ loading ? 'Creating account...' : 'Sign Up' }}
        </button>
      </form>
    </div>
    <div class="card-footer text-center py-3">
      <span class="text-muted">Already have an account? </span>
      <a [routerLink]="['/login']" class="text-decoration-none fw-semibold">Login</a>
    </div>
  </div>
</div>
